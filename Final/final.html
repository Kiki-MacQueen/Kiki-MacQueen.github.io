<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volume Control</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 30px;
    }

    .volume-bar-track {
      width: 200px;
      height: 12px;
      background: #444;
      border-radius: 6px;
      cursor: pointer;
      display: inline-block;
    }

    .volume-bar-fill {
      height: 100%;
      background: #4cc9f0;
      border-radius: 6px;
      width: 50%;
      transition: width 0.4s;
    }

    #volumePercent {
      margin-left: 10px;
    }

    #quizBox {
      display: none;
      margin-top: 30px;
      background: #333;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 280px;
    }

    #quizBox h2 {
      margin-bottom: 15px;
    }

    .answer-btn {
      margin: 6px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #888;
      background: #555;
      color: white;
    }

    .answer-btn:hover {
      background: #666;
    }

    #feedback {
      margin-top: 12px;
      color: #ff6b6b;
      min-height: 20px;
    }

    #timer {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #f0a500;
    }

    #timer.urgent {
      color: #ff4444;
    }
  </style>
</head>
<body>

  <h1>Volume Control</h1>

  <div>
    <span>🔊</span>
    <div class="volume-bar-track" id="volumeTrack">
      <div class="volume-bar-fill" id="volumeFill"></div>
    </div>
    <span id="volumePercent">50%</span>
  </div>

  <p style="color:#888; font-size:0.8rem; margin-top:8px;">click the bar to change volume</p>

  <div id="quizBox">
    <div id="timer">10</div>
    <p>solve this to set the volume:</p>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="feedback"></p>
  </div>

  <script>
    let volume = 50;
    let correctAns = 0;
    let timerInterval = null;
    let timeLeft = 10;

    // grabbing all the elements i need
    const track = document.getElementById('volumeTrack');
    const fill = document.getElementById('volumeFill');
    const pct = document.getElementById('volumePercent');
    const quizBox = document.getElementById('quizBox');
    const questionEl = document.getElementById('question');
    const answersEl = document.getElementById('answers');
    const feedbackEl = document.getElementById('feedback');
    const timerEl = document.getElementById('timer');

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 10;
      timerEl.textContent = timeLeft;
      timerEl.classList.remove('urgent');

      timerInterval = setInterval(function() {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 2) timerEl.classList.add('urgent');

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          quizBox.style.display = 'none';
          feedbackEl.textContent = '';
        }
      }, 1000);
    }

    function showQuiz(e) {
      // figure out where on the bar the user clicked (0 to 1)
      var rect = track.getBoundingClientRect();
      var clickPos = (e.clientX - rect.left) / rect.width;
      clickPos = Math.max(0, Math.min(1, clickPos));

      quizBox.style.display = 'block';
      generateQuestion(clickPos);
      startTimer();
    }

    function generateQuestion(clickPos) {
      feedbackEl.textContent = '';

      // low = 0-33%, mid = 34-66%, high = 67-100%
      var targetMin, targetMax;
      if (clickPos < 0.33) {
        targetMin = 6;
        targetMax = 30;
      } else if (clickPos < 0.66) {
        targetMin = 31;
        targetMax = 60;
      } else {
        targetMin = 61;
        targetMax = 81; // max single digit product is 9x9=81
      }

      // find a multiplication pair whose product lands in the target range
      var a, b, product;
      var tries = 0;
      do {
        a = rand(2, 9);
        b = rand(2, 9);
        product = a * b;
        tries++;
      } while ((product < targetMin || product > targetMax) && tries < 100);

      correctAns = product;
      questionEl.textContent = a + ' × ' + b + ' = ?';

      // 3 wrong answers, kept them close so its not too obvious
      const wrongs = new Set();
      while (wrongs.size < 3) {
        const w = correctAns + rand(-8, 8);
        if (w !== correctAns && w >= targetMin - 5 && w <= targetMax + 5) wrongs.add(w);
      }

      const choices = shuffle([correctAns, ...wrongs]);

      answersEl.innerHTML = '';
      choices.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = val + '%';
        btn.onclick = () => checkAnswer(val);
        answersEl.appendChild(btn);
      });
    }

    function checkAnswer(chosen) {
      if (chosen === correctAns) {
        clearInterval(timerInterval);
        volume = correctAns;
        fill.style.width = volume + '%';
        pct.textContent = volume + '%';
        feedbackEl.style.color = '#6bffb8';
        feedbackEl.textContent = 'correct! volume set to ' + volume + '%';
        setTimeout(() => { quizBox.style.display = 'none'; }, 900);
      } else {
        feedbackEl.style.color = '#ff6b6b';
        feedbackEl.textContent = 'wrong. try again.';
        // resets the question after a sec
        setTimeout(() => generateQuestion(lastClickPos), 900);
      }
    }

    // store last click position so wrong answer regenerate stays in same range
    var lastClickPos = 0.5;
    track.addEventListener('click', function(e) {
      var rect = track.getBoundingClientRect();
      lastClickPos = (e.clientX - rect.left) / rect.width;
      lastClickPos = Math.max(0, Math.min(1, lastClickPos));
      showQuiz(e);
    });
  </script>

</body>
</html>
