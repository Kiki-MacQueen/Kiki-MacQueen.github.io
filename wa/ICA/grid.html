<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid</title>

  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .grid > div {
      background: #4d7298;
      border: 2px solid #77a6b6;
      border-radius: 8px;
      color: white;
      padding: 12px;
      font: 20px/1.4 sans-serif;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div>One</div>
    <div>Two</div>
    <div>Three</div>
    <div>Four</div>
  </div>
</body>
</html>
